# Pruebas de la app en emuladores de varias versiones de Android (tests/emulador.sh):
# instalar, abrir cada pantalla y los enlaces, pausar con Ajustes rapidos y sin cierres con error.
# Se lanza en los PR que tocan la app, cada lunes y a mano (Actions > emulador > Run workflow).
name: emulador

on:
  pull_request:
    paths: ['app/**', 'tests/**', '.github/workflows/emulador.yml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache de herramientas
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/setup-tools.sh') }}
      - name: Herramientas (make setup)
        run: make setup
      - name: APK de prueba (firma temporal)
        run: |
          make module
          NEW_KEY=1 KEYSTORE_DIR="$RUNNER_TEMP/ci-key" ./app/build.sh apk
          rm -rf "$RUNNER_TEMP/ci-key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-emulador
          path: dist/*.apk

  emulador:
    needs: apk
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 33, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk-emulador
          path: dist
      - name: Acelerador del emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pruebas en Android API ${{ matrix.api }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./tests/emulador.sh "$(ls dist/GamepadMapper-*.apk | head -n1)" emulator-5554
      - name: Capturas y registro
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulador-api-${{ matrix.api }}
          path: tests/out/
