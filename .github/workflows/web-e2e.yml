# Pruebas de la web en un navegador real (Chrome sin ventana) en cada pull request que la toque:
#   a) sin desplazamiento horizontal a 320-1024 px en espanol e ingles,
#   b) todos los enlaces internos de las paginas principales abren una pagina valida,
#   c) sin errores en la consola, d) manifiesto y service worker correctos.
# Compila la web con la ruta base de GitHub Pages y la sirve en local contra la base de datos
# PUBLICA (solo lectura: no inicia sesion ni escribe). Usa las mismas variables publicas que
# web.yml: SUPABASE_URL y SUPABASE_ANON_KEY (nunca la service_role).
name: web-e2e

on:
  pull_request:
    paths: ['web/**', '.github/workflows/web-e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      VITE_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      E2E_BASE_PATH: /${{ github.event.repository.name }}/
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Comprobar configuracion
        id: config
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Faltan las variables SUPABASE_URL / SUPABASE_ANON_KEY (p. ej. en un fork): no se ejecutan las pruebas e2e."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Chrome
        if: steps.config.outputs.ok == 'true'
        run: '"$CHROME_PATH" --version'
      - name: Pruebas en navegador
        if: steps.config.outputs.ok == 'true'
        run: pnpm e2e
