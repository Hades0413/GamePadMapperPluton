# Compila y prueba en cada push con los mismos comandos que en local (Makefile).
# Al crear un tag v* firma el APK y lo sube al Release; el AAB (Google Play) queda como
# artefacto descargable de la ejecucion.
# Secretos necesarios SOLO para firmar (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    contenido de keystore/gamepad-mapper.jks en base64
#   KEYSTORE_PASSWORD  contenido de keystore/password.txt
name: build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Solo lectura por defecto; escribir (subir al Release) solo en los tags v*.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache de herramientas
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/setup-tools.sh') }}

      - name: Herramientas (make setup)
        run: make setup

      - name: Pruebas del formato de perfil
        run: make test

      - name: Modulos (gpmapper ARM64 y Touch Fix)
        run: make module touchfix

      - name: Clave de firma
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Faltan los secretos KEYSTORE_BASE64 / KEYSTORE_PASSWORD: no se puede firmar" >&2; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/gamepad-mapper.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore/password.txt"
          echo "KEYSTORE_DIR=$RUNNER_TEMP/keystore" >> "$GITHUB_ENV"

      - name: App (APK y AAB)
        run: |
          if [ -z "${KEYSTORE_DIR:-}" ]; then
            # Sin clave (push normal): firma temporal solo para comprobar que compila.
            NEW_KEY=1 KEYSTORE_DIR="$RUNNER_TEMP/ci-key" ./app/build.sh all
          else
            ./app/build.sh all
          fi

      - name: Borrar la clave de firma del runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore" "$RUNNER_TEMP/ci-key"

      - name: Guardar APK y AAB (descargables desde la ejecucion)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Sin tag, la firma es temporal: sirve para probar, no para actualizar la app ni para Play.
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'app-firmada' || 'app-prueba-firma-temporal' }}
          path: |
            dist/*.apk
            dist/*.aab
            dist/*.zip

  # Unico job con permiso de escritura: sube al Release lo que compilo "build" (solo en tags v*).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-firmada
          path: dist
      - name: Publicar en el Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          apk="$(ls dist/GamepadMapper-*.apk | head -n1)"
          ver="$(basename "$apk" .apk)"; ver="${ver#GamepadMapper-}"
          cp "$apk" dist/GamepadMapperPluton-"$ver".apk
          gh release view "$tag" --repo "$REPO" > /dev/null 2>&1 || \
            gh release create "$tag" --repo "$REPO" --title "Gamepad Mapper Plutón $ver" --notes "Ver README."
          gh release upload "$tag" --repo "$REPO" --clobber dist/GamepadMapperPluton-"$ver".apk dist/gamepad_mapper-v*.zip dist/gamepadplus_touchfix-v*.zip
