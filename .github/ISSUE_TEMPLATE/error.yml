name: Error
description: Algo no funciona como debería
labels: [error]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué pasa
      description: Qué esperabas y qué ocurre en realidad.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abro el juego...\n2. Pulso...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la app
      placeholder: "1.3"
    validations:
      required: true
  - type: input
    id: telefono
    attributes:
      label: Teléfono y versión de Android
      placeholder: "Redmi Note 9, Android 13"
    validations:
      required: true
  - type: input
    id: mando
    attributes:
      label: Mando
      placeholder: "Xbox Series por Bluetooth"
  - type: dropdown
    id: modo
    attributes:
      label: Modo
      options: [Accesibilidad (sin root), Root (Magisk), Shizuku]
    validations:
      required: true
  - type: textarea
    id: registro
    attributes:
      label: Registro (opcional)
      description: Ajustes › Registro en la app. Revisa que no tenga datos personales.
      render: text
