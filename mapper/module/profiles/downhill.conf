# Downhill Revived - controles en pantalla del juego (horizontal, 2340x1080)
package = app.downhillrevived
screen = 2340x1080
deadzone = 0.18

# Botones de accion (A abajo, B derecha, X izquierda, Y arriba)
A = tap 1980 895        # Cruz
B = tap 2172 745        # Circulo
X = tap 1787 745        # Cuadrado
Y = tap 1980 605        # Triangulo

# Gatillos / bumpers
L1 = tap 675 398
L2 = tap 372 398
R1 = tap 1705 398
R2 = tap 2005 398

SELECT = tap 550 85
START  = tap 765 85
L3 = tap 707 917
R3 = tap 1642 940

# Stick izquierdo -> joystick del juego (centro 405,735; radio 150 px)
LS = stick 405 735 150

# Cruceta -> bordes del joystick
DPAD_UP    = tap 405 585
DPAD_DOWN  = tap 405 885
DPAD_LEFT  = tap 255 735
DPAD_RIGHT = tap 555 735
