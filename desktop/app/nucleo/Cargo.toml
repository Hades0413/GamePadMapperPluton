[package]
name = "gpm-nucleo"
description = "Nucleo de Gamepad Mapper Pluton para escritorio: mandos, mapeos y asistente"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "nucleo"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

# Linux: el crate evdev envuelve los ioctl de /dev/input (sin unsafe propio), trae el creador de
# dispositivos uinput (prueba de integracion y, en la fase 2, el mando virtual) y la vibracion (FF).
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_XboxController"] }
