# Espacio de trabajo de la app de escritorio (Tauri v2).
#   nucleo     -> biblioteca sin Tauri: mandos, mapeos y asistente «Asignar todo»
#   src-tauri  -> la aplicacion (ventana, comandos, bandeja)
[workspace]
resolver = "2"
members = ["nucleo", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Hades0413"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
